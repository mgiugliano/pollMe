name: Build and Release macOS App

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build macOS App
        run: |
          cd macOS_App
          make
          zip -r PollMe_macOS.zip PollMe.app

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: macOS_App/PollMe_macOS.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
