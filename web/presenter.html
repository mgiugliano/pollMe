<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poll Results Overlay</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: rgba(249, 250, 251, 0.95); margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-12">
    <div class="w-full max-w-5xl text-center">
        <h1 id="question-title" class="text-5xl font-bold mb-2 text-gray-800">Waiting for Poll...</h1>
        <h2 id="question-subtitle" class="text-2xl font-medium mb-6 text-gray-500 hidden"></h2>
        
        <div class="relative h-[450px] w-full flex justify-center items-center">
            <canvas id="resultsChart"></canvas>
            <div id="wordcloud-container" class="hidden w-full h-full flex flex-wrap justify-center items-center content-center gap-6 p-4 overflow-hidden"></div>
        </div>
        
        <div class="mt-12 flex justify-between items-center px-8 border-t border-gray-300 pt-8">
            <div class="text-3xl font-semibold text-gray-600">
                Votes: <span id="total-votes" class="text-black font-bold ml-2 text-5xl">0</span>
            </div>
            
            <div class="flex items-center space-x-6 bg-white p-4 rounded-xl shadow-sm border border-gray-200">
                <div class="text-right">
                    <div class="text-xl text-gray-500 font-medium">Scan to join</div>
                    <div class="text-3xl font-bold text-blue-600 mt-1" id="display-url">YOUR_DOMAIN_HERE.com/poll</div>
                </div>
                <div id="qrcode-container" class="w-[112px] h-[112px] bg-white flex justify-center items-center rounded-md"></div>
            </div>
        </div>
    </div>
    
    <!-- Local Javascript QR Code generation (No external image API required!) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
        // CHANGE THIS URL TO YOUR ACTUAL DOMAIN!
        const POLL_URL = "https://YOUR_DOMAIN_HERE.com/poll";
        
        document.getElementById('display-url').innerText = POLL_URL.replace('https://', '').replace('http://', '');
        new QRCode(document.getElementById("qrcode-container"), {
            text: POLL_URL,
            width: 112,
            height: 112,
            colorDark : "#000000",
            colorLight : "#ffffff",
            correctLevel : QRCode.CorrectLevel.L
        });
    </script>
    <script src="app.js?v=6"></script>
</body>
</html>
