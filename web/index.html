<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Live Poll</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f3f4f6; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4">

    <!-- Waiting View -->
    <div id="waiting-view" class="text-center w-full max-w-md">
        <div class="animate-pulse mb-6 text-gray-400">
            <svg class="w-16 h-16 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        </div>
        <h1 class="text-2xl font-bold text-gray-700 mb-2">Waiting for next poll...</h1>
        <p class="text-gray-500">Look at the presentation screen.</p>
    </div>

    <!-- Voting View -->
    <div id="voting-view" class="hidden w-full max-w-md bg-white p-6 rounded-xl shadow-md">
        <h2 id="voter-question" class="text-2xl font-bold mb-2 text-gray-800"></h2>
        <h3 id="voter-subtitle" class="text-lg font-medium mb-6 text-gray-500 hidden"></h3>
        <div id="voter-options" class="space-y-4">
            <!-- Buttons dynamically injected here -->
        </div>
    </div>

    <!-- Voted View -->
    <div id="voted-view" class="hidden text-center w-full max-w-md">
        <div class="mb-6 text-green-500">
            <svg class="w-20 h-20 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        </div>
        <h1 class="text-3xl font-bold text-gray-800 mb-2">Vote Cast!</h1>
        <p class="text-gray-500 text-lg">Look at the presentation screen for results.</p>
    </div>

    <script src="app.js?v=5"></script>
</body>
</html>
